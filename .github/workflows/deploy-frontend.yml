name: Deploy frontend (Firebase Hosting + Firestore rules)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  PROJECT_ID: rehearsal-ai-builder-cup-2026

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npx eslint .
          npx vitest run
          npm run build

      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore rules on the emulator
        working-directory: frontend
        run: npm run test:rules

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Rules ship with the site so saves and rules never drift apart.
      - name: Deploy Firestore rules and Firebase Hosting
        run: npx --yes firebase-tools deploy --only firestore:rules,hosting --project "$PROJECT_ID" --non-interactive
